<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>Noceto Lab</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f4f5;
  color: #111;
}

header {
  background: #111;
  color: white;
  padding: 18px 22px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

header h1 {
  margin: 0;
  font-size: 21px;
}

.container {
  max-width: 1000px;
  margin: auto;
  padding: 20px;
}

.card {
  background: white;
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 20px;
  box-shadow: 0 3px 12px rgba(0,0,0,.06);
}

input,
textarea,
select {
  width: 100%;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 9px;
  margin-top: 6px;
  font-size: 15px;
}

label {
  display: block;
  margin-top: 14px;
  font-weight: bold;
}

button {
  border: 0;
  border-radius: 9px;
  padding: 11px 15px;
  cursor: pointer;
  font-weight: bold;
}

.primary {
  background: #111;
  color: white;
}

.secondary {
  background: #ddd;
}

.danger {
  background: #c62828;
  color: white;
}

.hidden {
  display: none;
}

.grid {
  display: grid;
  grid-template-columns:
    repeat(auto-fill, minmax(220px, 1fr));
  gap: 12px;
}

.patient {
  border: 1px solid #ddd;
  border-radius: 12px;
  padding: 16px;
  cursor: pointer;
  background: white;
}

.patient:hover {
  background: #f1f1f1;
}

.exercise {
  border: 1px solid #ddd;
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 12px;
}

.exercise.completed {
  opacity: .6;
}

.exercise h3 {
  margin-top: 0;
}

.message {
  margin-top: 12px;
  padding: 10px;
  border-radius: 8px;
}

.error {
  background: #ffe3e3;
  color: #900;
}

.success {
  background: #e3f7e3;
  color: #176b17;
}

.actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.login {
  max-width: 420px;
  margin: 80px auto;
}

.video {
  margin-top: 10px;
}

.video a {
  color: #0645ad;
  font-weight: bold;
}

@media(max-width:600px) {

  .container {
    padding: 12px;
  }

  .card {
    padding: 16px;
  }

}

</style>

</head>


<body>


<header>

<h1>🏥 Noceto Lab</h1>

<button
id="logoutButton"
class="secondary hidden"
>
Esci
</button>

</header>


<div class="container">


<!-- LOGIN -->

<section
id="loginPage"
class="login"
>

<div class="card">

<h2>Accedi</h2>

<label>
Email
</label>

<input
id="email"
type="email"
placeholder="La tua email"
>

<label>
Password
</label>

<input
id="password"
type="password"
placeholder="Password"
>

<br><br>

<button
id="loginButton"
class="primary"
>
Accedi
</button>

<div
id="loginMessage"
class="message hidden"
></div>

</div>

</section>


<!-- AREA FISIOTERAPISTA -->

<section
id="therapistPage"
class="hidden"
>

<div class="card">

<h2>👨‍⚕️ Dashboard</h2>

<div class="actions">

<button
id="newPatientButton"
class="primary"
>
＋ Nuovo paziente
</button>

<button
id="newExerciseButton"
class="secondary"
>
＋ Nuovo esercizio
</button>

</div>

</div>


<div class="card">

<h2>👥 Pazienti</h2>

<div
id="patientsList"
class="grid"
>
Caricamento...
</div>

</div>

</section>


<!-- SCHEDA PAZIENTE -->

<section
id="patientPage"
class="hidden"
>

<button
id="backButton"
class="secondary"
>
← Pazienti
</button>

<br><br>

<div class="card">

<h2 id="patientTitle">
Paziente
</h2>

</div>


<div class="card">

<h2>📋 Programma</h2>

<div id="patientExercises">
</div>

</div>


<div class="card">

<h2>＋ Assegna esercizio</h2>

<label>
Esercizio

<select id="exerciseSelect">

<option value="">
Seleziona esercizio
</option>

</select>

>

</label>

id="duration"
type="number"
placeholder="30"
>

Recupero (secondi)
</label>

id="rest"

placeholder="60"
>

Note
</label>

></textarea>

<br><br>

<button
id="assignButton"
class="primary"
>
Assegna
</button>

></div>

</div>

</section>


<!-- NUOVO PAZIENTE -->

<section
id="newPatientPage"
class="hidden"
>

<div class="card">

<h2>Nuovo paziente</h2>

<label>
Nome
</label>

<input
id="newPatientName"
placeholder="Nome paziente"
>

<label>
Email account paziente
</label>

<input
id="newPatientEmail"
type="email"
placeholder="email@esempio.it"
>

<br><br>

<button
id="savePatient"
class="primary"
>
Salva
</button>

<button
id="cancelPatient"

>
Annulla
</button>

class="message hidden"
></div>

</div>

<!-- NUOVO ESERCIZIO -->

<section
id="newExercisePage"

>

<div class="card">

<h2>Nuovo esercizio</h2>

<label>
Nome
</label>

<input
id="exerciseName"
placeholder="Es. Squat"
>

<label>
Descrizione
</label>

<textarea
id="exerciseDescription"
placeholder="Descrizione..."
></textarea>

<label>
Video URL
</label>

<input
id="exerciseVideo"
placeholder="https://..."
>

<button
id="saveExercise"
class="primary"
>
Salva esercizio

<section
id="patientPortal"
class="hidden"
>

<div class="card">

Ciao 👋
</h2>

<p>
Questo è il tuo programma di esercizi.
</p>

</div>


<div class="card">

<h2>🏋️ I tuoi esercizi</h2>

<div id="patientPortalExercises">
</div>

</div>

<script
src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<script>


/* ============================
   SUPABASE
============================ */

const SUPABASE_URL =
"https://eutcpxmnrzisssddefau.supabase.co";

const SUPABASE_KEY =
"sb_publishable_C2DPlnqwDgOkEC1FrdGDhg_XQ8m3KLz";

const db =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* ============================
   VARIABILI
============================ */

let currentUser = null;

let currentPatient = null;


/* ============================
   ELEMENTI
============================ */

const loginPage =
document.getElementById(
  "loginPage"
);

const therapistPage =
document.getElementById(
  "therapistPage"
);

const patientPage =
document.getElementById(
  "patientPage"
);

const newPatientPage =
document.getElementById(
  "newPatientPage"
);

const newExercisePage =
document.getElementById(
  "newExercisePage"
);

const patientPortal =
document.getElementById(
  "patientPortal"
);

const logoutButton =
document.getElementById(
  "logoutButton"
);


/* ============================
   NAVIGAZIONE
============================ */

function hideAllPages() {

  loginPage.classList.add("hidden");

  therapistPage.classList.add("hidden");

  patientPage.classList.add("hidden");

  newPatientPage.classList.add("hidden");

  newExercisePage.classList.add("hidden");

  patientPortal.classList.add("hidden");

}


function showPage(page) {

  hideAllPages();

  page.classList.remove("hidden");

}


/* ============================
   LOGIN
============================ */

document
.getElementById("loginButton")
.addEventListener(
"click",
async function() {

  const email =
  document.getElementById(
    "email"
  ).value.trim();

  const password =
  document.getElementById(
    "password"
  ).value;


  const result =
  await db.auth.signInWithPassword({

    email:
      email,

    password:
      password

  });


  if(result.error) {

    showMessage(
      "loginMessage",
      result.error.message,
      "error"
    );

    return;

  }

  currentUser =
    result.data.user;

  await startApp();

});


/* ============================
   SESSIONE
============================ */

async function startApp() {

  const result =
  await db.auth.getUser();


  if(result.error) {

    showPage(
      loginPage
    );

    return;

  }


  currentUser =
    result.data.user;


  logoutButton
  .classList
  .remove("hidden");


  /*
     Per ora riconosciamo il fisioterapista
     tramite email.
  */

  if(
    currentUser.email ===
    "riva.fisioterapia@gmail.com"
  ) {

    await startTherapist();

  } else {

    await startPatient();

  }

}


/* ============================
   FISIOTERAPISTA
============================ */

async function startTherapist() {

  showPage(
    therapistPage
  );

  await loadPatients();

}


/* ============================
   PAZIENTE
============================ */

async function startPatient() {

  const result =
  await db

  .from("patients")

  .select("*")

  .eq(
    "user_id",
    currentUser.id
  )

  .maybeSingle();


  if(result.error) {

    alert(
      result.error.message
    );

    return;

  }


  if(!result.data) {

    alert(
      "Nessun profilo paziente associato a questo account."
    );

    return;

  }


  currentPatient =
    result.data;


  document.getElementById(
    "patientWelcome"
  ).innerText =
    "Ciao " +
    currentPatient.name +
    " 👋";


  showPage(
    patientPortal
  );


  await loadPatientPortal();

}


/* ============================
   PAZIENTI
============================ */

async function loadPatients() {

  const list =
  document.getElementById(
    "patientsList"
  );


  list.innerHTML =
    "Caricamento...";


  const result =
  await db

  .from("patients")

  .select("*")

  .order(
    "name"
  );


  if(result.error) {

    list.innerHTML =
      result.error.message;

    return;

  }


  list.innerHTML = "";


  if(!result.data.length) {

    list.innerHTML =
      "Nessun paziente.";

    return;

  }


  result.data.forEach(
  function(patient) {

    const div =
    document.createElement(
      "div"
    );


    div.className =
      "patient";


    div.innerHTML = `

      <strong>
        👤 ${escapeHTML(
          patient.name
        )}
      </strong>

      <br><br>

      <small>
        Apri scheda →
      </small>

    `;


    div.addEventListener(
      "click",
      function() {

        openPatient(
          patient
        );

      }
    );


    list.appendChild(
      div
    );

  });

}


/* ============================
   APRI PAZIENTE
============================ */

async function openPatient(patient) {

  currentPatient =
    patient;


  document.getElementById(
    "patientTitle"
  ).innerText =
    "👤 " +
    patient.name;


  showPage(
    patientPage
  );


  await loadExercises();

  await loadPatientExercises();

}


/* ============================
   ESERCIZI
============================ */

async function loadExercises() {

  const select =
  document.getElementById(
    "exerciseSelect"
  );


  select.innerHTML = `

    <option value="">
      Seleziona esercizio
    </option>

  `;


  const result =
  await db

  .from("exercises")

  .select("*")

  .order(
    "name"
  );


  if(result.error) {

    console.error(
      result.error
    );

    return;

  }


  result.data.forEach(
  function(exercise) {

    const option =
    document.createElement(
      "option"
    );


    option.value =
      exercise.id;


    option.textContent =
      exercise.name;


    select.appendChild(
      option
    );

  });

}


/* ============================
   ESERCIZI PAZIENTE
============================ */

async function loadPatientExercises() {

  const container =
  document.getElementById(
    "patientExercises"
  );


  container.innerHTML =
    "Caricamento...";


  const result =
  await db

  .from("patient_exercises")

  .select(`

    id,
    sets,
    reps,
    duration,
    rest,
    notes,
    completed,

    exercises (
      name,
      description,
      video_url

    )

  `)

  .eq(
    "patient_id",
    currentPatient.id
  );


  if(result.error) {

    container.innerHTML =
      result.error.message;

    return;

  }


  container.innerHTML = "";


  if(!result.data.length) {

    container.innerHTML =
      "Nessun esercizio assegnato.";

    return;

  }


  result.data.forEach(
  function(item) {

    const div =
    document.createElement(
      "div"
    );


    div.className =
      "exercise";


    let info = "";


    if(item.sets)
      info +=
        item.sets +
        " serie";


    if(item.reps)
      info +=
        " × " +
        item.reps +
        " rip";


    if(item.duration)
      info +=
        " · " +
        item.duration +
        " sec";


    if(item.rest)
      info +=
        " · recupero " +
        item.rest +
        "\"";


    div.innerHTML = `

      <h3>
        ${escapeHTML(
          item.exercises.name
        )}
      </h3>

      <p>
        ${escapeHTML(info)}
      </p>

      ${
        item.exercises.description
        ?
        `<p>
          ${escapeHTML(
            item.exercises.description
          )}
        </p>`
        :
        ""
      }

      ${
        item.exercises.video_url
        ?
        `<div class="video">
          🎥
          <a
            href="${escapeAttribute(
              item.exercises.video_url
            )}"
            target="_blank"
          >
            Guarda video
          </a>
        </div>`
        :
        ""
      }

      ${
        item.notes
        ?
        `<p>
          📝 ${escapeHTML(
            item.notes
          )}
        </p>`
        :
        ""
      }

      <br>

      <label>

        <input
          type="checkbox"
          class="completion"
          data-id="${item.id}"
          ${
            item.completed
            ? "checked"
            : ""
          }
        >

        Completato

      </label>

    `;


    container.appendChild(
      div
    );

  });


  document
  .querySelectorAll(
    ".completion"
  )
  .forEach(
  function(box) {

    box.addEventListener(
      "change",
      updateCompletion
    );

  });

}


/* ============================
   PORTALE PAZIENTE
============================ */

async function loadPatientPortal() {

  const container =
  document.getElementById(
    "patientPortalExercises"
  );


  container.innerHTML =
    "Caricamento...";


  const result =
  await db

  .from("patient_exercises")

  .select(`

    id,
    sets,
    reps,
    duration,
    rest,
    notes,
    completed,

    exercises (
      name,
      description,
      video_url

    )

  `)

  .eq(
    "patient_id",
    currentPatient.id
  );


  if(result.error) {

    container.innerHTML =
      result.error.message;

    return;

  }


  container.innerHTML = "";


  if(!result.data.length) {

    container.innerHTML =
      "Non hai ancora esercizi assegnati.";

    return;

  }


  result.data.forEach(
  function(item) {

    const div =
    document.createElement(
      "div"
    );


    div.className =
      "exercise";


    let info = "";


    if(item.sets)
      info +=
        item.sets +
        " serie";


    if(item.reps)
      info +=
        " × " +
        item.reps +
        " ripetizioni";


    if(item.duration)
      info +=
        " · " +
        item.duration +
        " secondi";


    if(item.rest)
      info +=
        " · recupero " +
        item.rest +
        "\"";


    div.innerHTML = `

      <h3>
        ${escapeHTML(
          item.exercises.name
        )}
      </h3>

      <p>
        ${escapeHTML(info)}
      </p>

      ${
        item.exercises.description
        ?
        `<p>
          ${escapeHTML(
            item.exercises.description
          )}
        </p>`
        :
        ""
      }

      ${
        item.exercises.video_url
        ?
        `<div class="video">

          🎥

          <a
            href="${escapeAttribute(
              item.exercises.video_url
            )}"
            target="_blank"
          >
            Guarda video
          </a>

        </div>`
        :
        ""
      }

      ${
        item.notes
        ?
        `<div>

          📝 ${escapeHTML(
            item.notes
          )}

        </div>`
        :
        ""
      }

      <br>

      <label>

        <input
          type="checkbox"
          class="portalCompletion"
          data-id="${item.id}"
          ${
            item.completed
            ? "checked"
            : ""
          }
        >

        Ho completato questo esercizio

      </label>

    `;


    container.appendChild(
      div
    );

  });


  document
  .querySelectorAll(
    ".portalCompletion"
  )
  .forEach(
  function(box) {

    box.addEventListener(
      "change",
      updateCompletion
    );

  });

}


/* ============================
   COMPLETAMENTO
============================ */

async function updateCompletion(event) {

  const id =
    event.target.dataset.id;


  const completed =
    event.target.checked;


  const result =
  await db

  .from("patient_exercises")

  .update({

    completed:
      completed

  })

  .eq(
    "id",
    id
  );


  if(result.error) {

    alert(
      result.error.message
    );

  }

}


/* ============================
   NUOVO PAZIENTE
============================ */

document
.getElementById(
  "newPatientButton"
)
.addEventListener(
"click",
function() {

  showPage(
    newPatientPage
  );

});


document
.getElementById(
  "savePatient"
)
.addEventListener(
"click",
async function() {

  const name =
  document.getElementById(
    "newPatientName"
  ).value.trim();


  if(!name) {

    showMessage(
      "patientMessage",
      "Inserisci il nome.",
      "error"
    );

    return;

  }


  /*
     Per ora NON associamo ancora
     automaticamente l'account.
  */

  const result =
  await db

  .from("patients")

  .insert({

    name:
      name

  });


  if(result.error) {

    showMessage(
      "patientMessage",
      result.error.message,
      "error"
    );

    return;

  }


  showMessage(
    "patientMessage",
    "Paziente creato.",
    "success"
  );


  setTimeout(
  function() {

    startTherapist();

  },
  700
  );

});


/* ============================
   NUOVO ESERCIZIO
============================ */

document
.getElementById(
  "newExerciseButton"
)
.addEventListener(
"click",
function() {

  showPage(
    newExercisePage
  );

});


document
.getElementById(
  "saveExercise"
)
.addEventListener(
"click",
async function() {

  const name =
  document.getElementById(
    "exerciseName"
  ).value.trim();


  const description =
  document.getElementById(
    "exerciseDescription"
  ).value.trim();


  const video =
  document.getElementById(
    "exerciseVideo"
  ).value.trim();


  if(!name) {

    showMessage(
      "exerciseMessage",
      "Inserisci il nome.",
      "error"
    );

    return;

  }


  const result =
  await db

  .from("exercises")

  .insert({

    name:
      name,

    description:
      description || null,

    video_url:
      video || null

  });


  if(result.error) {

    showMessage(
      "exerciseMessage",
      result.error.message,
      "error"
    );

    return;

  }


  showMessage(
    "exerciseMessage",
    "Esercizio creato.",
    "success"
  );


  setTimeout(
  function() {

    startTherapist();

  },
  700
  );

});


/* ============================
   ASSEGNA
============================ */

document
.getElementById(
  "assignButton"
)
.addEventListener(
"click",
async function() {

  const exerciseId =
  document.getElementById(
    "exerciseSelect"
  ).value;


  if(!exerciseId) {

    showMessage(
      "assignMessage",
      "Seleziona un esercizio.",
      "error"
    );

    return;

  }


  const result =
  await db

  .from("patient_exercises")

  .insert({

    patient_id:
      currentPatient.id,

    exercise_id:
      exerciseId,

    sets:
      parseInt(
        document.getElementById(
          "sets"
        ).value
      ) || null,

    reps:
      parseInt(
        document.getElementById(
          "reps"
        ).value
      ) || null,

    duration:
      parseInt(
        document.getElementById(
          "duration"
        ).value
      ) || null,

    rest:
      parseInt(
        document.getElementById(
          "rest"
        ).value
      ) || null,

    notes:
      document.getElementById(
        "notes"
      ).value.trim() || null

  });


  if(result.error) {

    showMessage(
      "assignMessage",
      result.error.message,
      "error"
    );

    return;

  }


  showMessage(
    "assignMessage",
    "Esercizio assegnato.",
    "success"
  );


  await loadPatientExercises();

});


/* ============================
   BOTTONI
============================ */

document
.getElementById(
  "backButton"
)
.addEventListener(
"click",
function() {

  startTherapist();

});


document
.getElementById(
  "cancelPatient"
)
.addEventListener(
"click",
function() {

  startTherapist();

});


document
.getElementById(
  "cancelExercise"
)
.addEventListener(
"click",
function() {

  startTherapist();

});


logoutButton
.addEventListener(
"click",
async function() {

  await db.auth.signOut();

  currentUser =
    null;

  logoutButton
  .classList
  .add("hidden");

  showPage(
    loginPage
  );

});

   UTILITÀ
============================ */

function showMessage(
  id,
  text,
  type
) {

  const el =
  document.getElementById(
    id
  );


  el.innerText =
    text;


  el.className =
    "message " +
    type;

}


function escapeHTML(text) {

  return String(
    text || ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}


function escapeAttribute(text) {

  return String(
    text || ""
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  );

}


/* ============================
   AVVIO
============================ */

db.auth
.getSession()
.then(
async function(result) {

  if(result.data.session) {

    await startApp();

  } else {

    showPage(
      loginPage
    );

  }

});
